<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AI-powered vocabulary builder for PDF readers">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ai_vocab_builder">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ai_vocab_builder</title>
  <link rel="manifest" href="manifest.json">

  <!-- Umami Analytics -->
  <script defer src="https://stats.houssammoallem.com/script.js" data-website-id="b7e25363-f784-45fe-b28a-dfbf61916a4b"></script>
  <script>
    function umamiTrackEvent(eventName, eventData) {
      if (typeof umami !== 'undefined') {
        try {
          umami.track(eventName, JSON.parse(eventData || '{}'));
        } catch(e) {
          umami.track(eventName);
        }
      }
    }
    function umamiTrackView(url, title) {
      if (typeof umami !== 'undefined') {
        umami.track(props => ({ ...props, url: url, title: title }));
      }
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Syncfusion PDF Viewer Web dependencies -->
  <script src="//cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
  <script type="text/javascript">
    pdfjsLib.GlobalWorkerOptions.workerSrc = "//cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js";
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
