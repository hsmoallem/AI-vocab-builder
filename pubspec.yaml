name: ai_vocab_builder
description: "AI-powered vocabulary builder — read PDFs, add words, AI translates with examples, review with flashcards"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local database (SQLite)
  sqflite: ^2.3.0
  path: ^1.9.0

  # State management
  provider: ^6.1.0

  # API calls (DeepSeek)
  http: ^1.2.0

  # Settings storage
  shared_preferences: ^2.3.0

  # Path utilities
  path_provider: ^2.1.0

  # PDF — pick files and extract text
  file_picker: ^11.0.0
  syncfusion_flutter_pdf: ^27.0.0

  # Phase 4 — Firebase (add when needed)
  # firebase_core: ^3.0.0
  # firebase_auth: ^5.0.0
  # cloud_firestore: ^5.0.0

  # Phase 6 — AdMob (add when needed)
  # google_mobile_ads: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
