name: ai_vocab_builder
description: "AI-powered vocabulary builder — read PDFs, add words, AI translates with examples, review with flashcards"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local database (SQLite)
  sqflite: ^2.4.0
  path: ^1.9.0

  # State management
  provider: ^6.1.0

  # API calls (DeepSeek)
  http: ^1.2.0

  # Settings storage
  shared_preferences: ^2.3.0

  # PDF — render natively + extract text
  flutter_pdfview: any
  syncfusion_flutter_pdf: any

  # Phase 4 — Firebase Auth + Firestore cloud backup
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  google_sign_in: ^6.2.0

  # Phase 6 — AdMob (add when needed)
  # google_mobile_ads: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: any
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
