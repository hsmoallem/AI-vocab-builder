name: ai_vocab_builder
description: "AI-powered vocabulary builder — read PDFs, add words, AI translates with examples, review with flashcards"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Local database (fast NoSQL, offline)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # State management
  provider: ^6.1.0

  # API calls (DeepSeek)
  http: ^1.2.0

  # Settings storage
  shared_preferences: ^2.3.0

  # File picker (Phase 2 — PDF selection)
  file_picker: ^8.0.0

  # PDF (Phase 2)
  syncfusion_flutter_pdf: ^27.0.0
  flutter_pdfview: ^1.3.0

  # Path utilities
  path_provider: ^2.1.0

  # Firebase (Phase 4 — add later)
  # firebase_core: ^3.0.0
  # firebase_auth: ^5.0.0
  # cloud_firestore: ^5.0.0

  # AdMob (Phase 6 — add later)
  # google_mobile_ads: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Isar code generator
  build_runner: ^2.4.0
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
